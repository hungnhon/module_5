<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Registration Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <h2 class="text-center mb-4">
                User Registration Form
            </h2>

            <form th:action="@{/register}"
                  th:object="${user}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">
                        First Name
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{firstName}">

                    <small class="text-danger"
                           th:errors="*{firstName}">
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Last Name
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{lastName}">

                    <small class="text-danger"
                           th:errors="*{lastName}">
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Phone Number
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{phoneNumber}">

                    <small class="text-danger"
                           th:errors="*{phoneNumber}">
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Age
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{age}">

                    <small class="text-danger"
                           th:errors="*{age}">
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{email}">

                    <small class="text-danger"
                           th:errors="*{email}">
                    </small>
                </div>

                <div class="text-center">
                    <button type="submit"
                            class="btn btn-primary">
                        Submit
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
