<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin bài hát</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 th:text="${song.id == null} ? 'Thêm bài hát' : 'Cập nhật bài hát'"></h3>
        </div>

        <div class="card-body">

            <form th:action="@{/songs/save}"
                  th:object="${song}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <!-- Tên bài hát -->
                <div class="mb-3">
                    <label class="form-label">Tên bài hát</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{name}">

                    <small class="text-danger"
                           th:errors="*{name}"></small>
                </div>

                <!-- Nghệ sĩ -->
                <div class="mb-3">
                    <label class="form-label">Nghệ sĩ</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{artist}">

                    <small class="text-danger"
                           th:errors="*{artist}"></small>
                </div>

                <!-- Thể loại -->
                <div class="mb-3">
                    <label class="form-label">Thể loại</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{genre}">

                    <small class="text-danger"
                           th:errors="*{genre}"></small>
                </div>

                <button class="btn btn-success">
                    Lưu
                </button>

                <a th:href="@{/songs}"
                   class="btn btn-secondary">
                    Quay lại
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
