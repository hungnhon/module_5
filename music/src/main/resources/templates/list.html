<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách bài hát</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">


    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2> Danh sách bài hát</h2>

        <a th:href="@{/songs/create}" class="btn btn-primary">
            + Thêm bài hát
        </a>

    </div>


    <table class="table table-bordered table-hover">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tên bài hát</th>
            <th>Nghệ sĩ</th>
            <th>Thể loại</th>
            <th style="width: 160px;">Chức năng</th>
        </tr>
        </thead>

        <tbody>


        <tr th:each="song : ${songs}">

            <td th:text="${song.id}"></td>

            <td th:text="${song.name}"></td>

            <td th:text="${song.artist}"></td>

            <td th:text="${song.genre}"></td>

            <td>


                <a th:href="@{/songs/edit/{id}(id=${song.id})}"
                   class="btn btn-warning btn-sm">
                    Sửa
                </a>


                <a th:href="@{/songs/delete/{id}(id=${song.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Bạn có chắc muốn xóa bài hát này?')">
                    Xóa
                </a>

            </td>

        </tr>


        <tr th:if="${#lists.isEmpty(songs)}">
            <td colspan="5" class="text-center text-muted">
                Chưa có bài hát nào
            </td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
