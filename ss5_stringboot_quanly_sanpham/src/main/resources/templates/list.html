<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            padding:30px;
        }

        .container{
            width:80%;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            color:#2c3e50;
            margin-bottom:20px;
        }

        .add-btn{
            display:inline-block;
            background:#28a745;
            color:white;
            padding:10px 15px;
            text-decoration:none;
            border-radius:5px;
            margin-bottom:15px;
        }

        .add-btn:hover{
            background:#218838;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#007bff;
            color:white;
            padding:12px;
        }

        td{
            padding:10px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:nth-child(even){
            background:#f8f9fa;
        }

        tr:hover{
            background:#e9ecef;
        }

        .edit{
            background:#ffc107;
            color:black;
            padding:6px 10px;
            text-decoration:none;
            border-radius:4px;
        }

        .delete{
            background:#dc3545;
            color:white;
            padding:6px 10px;
            text-decoration:none;
            border-radius:4px;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>QUẢN LÝ SẢN PHẨM</h1>

    <a href="/products/create" class="add-btn">
        + Thêm sản phẩm
    </a>

    <table>

        <tr>
            <th>ID</th>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Mô tả</th>
            <th>Sửa</th>
            <th>Xóa</th>
        </tr>

        <tr th:each="p : ${products}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.description}"></td>

            <td>
                <a class="edit"
                   th:href="@{/products/edit/{id}(id=${p.id})}">
                    Sửa
                </a>
            </td>

            <td>
                <a class="delete"
                   th:href="@{/products/delete/{id}(id=${p.id})}">
                    Xóa
                </a>
            </td>

        </tr>

    </table>

</div>

</body>
</html>
