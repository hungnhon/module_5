<!DOCTYPE html>

<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layouts/layout}">

<body>

<div layout:fragment="content">

    ```
    <div class="card">

        <div class="card-header bg-warning">

            <h3>Edit Blog</h3>

        </div>

        <div class="card-body">

            <form th:action="@{/blogs/update}"
                  th:object="${blog}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">

                <div class="mb-3">

                    <label>Title</label>

                    <input type="text"
                           th:field="*{title}"
                           class="form-control">

                </div>

                <div class="mb-3">

                    <label>Category</label>

                    <select th:field="*{category}"
                            class="form-select">

                        <option th:each="c : ${categories}"
                                th:value="${c.id}"
                                th:text="${c.name}">
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label>Content</label>

                    <textarea rows="10"
                              th:field="*{content}"
                              class="form-control">
                </textarea>

                </div>

                <button class="btn btn-warning">
                    Update
                </button>

                <a th:href="@{/blogs}"
                   class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>
    ```

</div>

</body>
</html>
